# Firebase App Hosting Configuration for AQ8 Algérie CRM

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: EMAIL_FROM
    value: "AQ8 Algérie <notifications@aq8algerie.com>"
  - variable: EMAIL_REPLY_TO
    value: "aq8algerie@gmail.com"
  - variable: APP_URL
    value: "https://aq8algerie.com"
